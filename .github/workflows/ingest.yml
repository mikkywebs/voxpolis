name: Voxpolis news ingest

# Runs the newsroom on a schedule by calling the site's /api/ingest endpoint.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SITE_URL     e.g. https://www.voxpolis.app
#   CRON_SECRET  the same value as CRON_SECRET in Vercel

on:
  schedule:
    - cron: '7 * * * *'   # every hour at :07
  workflow_dispatch:
    inputs:
      desk:
        description: 'One desk code (e.g. NG) or leave empty for the scheduled set'
        required: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pick desks
        id: pick
        run: |
          TIER1="NG US GB GH KE ZA IN CA AU WORLD"
          TIER2="UG ZW IE NZ PK PH"
          HOUR=$(date -u +%H)
          if [ -n "${{ github.event.inputs.desk }}" ]; then
            DESKS="${{ github.event.inputs.desk }}"
          elif [ $((10#$HOUR % 6)) -eq 0 ]; then
            DESKS="$TIER1 $TIER2"
          else
            DESKS="$TIER1"
          fi
          echo "desks=$DESKS" >> "$GITHUB_OUTPUT"

      - name: Run desks
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set SITE_URL and CRON_SECRET repository secrets first."; exit 1
          fi
          FAILED=0
          for DESK in ${{ steps.pick.outputs.desks }}; do
            echo "::group::$DESK"
            CODE=$(curl -sS -o out.json -w '%{http_code}' --max-time 90 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$SITE_URL/api/ingest?desk=$DESK" || echo 000)
            echo "HTTP $CODE"
            if command -v jq >/dev/null; then
              jq -c '{desk, published, candidates, itemsSeen, feedErrors, outcomes: [.outcomes[]? | {outcome, reason, slug}]}' out.json || cat out.json
            else
              cat out.json
            fi
            [ "$CODE" = "200" ] || FAILED=1
            echo "::endgroup::"
          done
          exit $FAILED
